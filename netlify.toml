[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

# Netlify Functions API Routes
[[redirects]]
  from = "/api/campaign"
  to = "/.netlify/functions/campaign"
  status = 200

[[redirects]]
  from = "/api/campaign/export"
  to = "/.netlify/functions/export"
  status = 200

# SPA-style redirects — serve index for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ras-logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
